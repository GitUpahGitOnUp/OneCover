<!-- the app shell: a toolbar whose links change by role, then <router-outlet /> where the current page appears.
     @if blocks re-render automatically b/c auth.isLoggedIn() and auth.role() are signals -->
<mat-toolbar>
  <a class="brand" [routerLink]="auth.isLoggedIn() ? auth.homeRoute() : '/login'">OneCover</a>

  @if (auth.isLoggedIn()) {
    <nav aria-label="Main">
      @if (auth.role() === 'Member') {
        <a mat-button routerLink="/member/plans" routerLinkActive="active">Plans</a>
        <a mat-button routerLink="/member/coverage" routerLinkActive="active">My Coverage</a>
        <a mat-button routerLink="/member/claims" routerLinkActive="active">My Claims</a>
        <a mat-button routerLink="/member/statements" routerLinkActive="active">Statements</a>
        <a mat-button routerLink="/member/profile" routerLinkActive="active">Profile</a>
      } @else {
        <!-- exact: true, or "Dashboard" (/admin) would ALSO light up on /admin/claims (it's a prefix of it) -->
        <a mat-button routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
        <a mat-button routerLink="/admin/claims" routerLinkActive="active">Claims</a>
        <a mat-button routerLink="/admin/payments" routerLinkActive="active">Payments</a>
        <a mat-button routerLink="/admin/plans" routerLinkActive="active">Plans</a>
      }
    </nav>
    <span class="spacer"></span>
    <button mat-button type="button" (click)="auth.logout()">Log out</button>
  }
</mat-toolbar>

<main class="page">
  <router-outlet />
</main>
